<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Remote Openings</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #131921, #232f3e);
            color: #ffffff;
            text-align: center;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 153, 0, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 8px 25px rgba(255, 153, 0, 0.7); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 153, 0, 0.4); }
        }
        .container {
            padding: 30px 20px;
            max-width: 440px;
            margin: 0 auto;
        }
        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #ff9900;
            margin-bottom: 10px;
        }
        .logo span { color: #ffffff; }
        .header {
            font-size: 30px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
        }
        .card {
            background: #ffffff;
            color: #111111;
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .highlight {
            font-size: 22px;
            font-weight: 800;
            color: #cc0c39;
            margin-bottom: 15px;
        }
        .steps {
            text-align: left;
            max-width: 320px;
            margin: 0 auto;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.6;
            color: #333333;
        }
        .btn {
            display: block;
            background: linear-gradient(to bottom, #ffb700, #ff9900);
            color: #111111;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            animation: pulse 2s infinite ease-in-out;
            border: 1px solid #d48000;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="logo">amazon<span>careers</span></div>
    <div class="header">Need Extra Cash This Week?</div>

    <div class="card">
        <div class="highlight">Work From Home & Earn More</div>
        <div class="steps">
            <p>1. Tap the button below to start</p>
            <p>2. Fill out the quick form</p>
            <p>3. Check available remote tasks</p>
        </div>
    </div>

    <a class="btn" href="https://www.af9m8trk.com/QLJ11S9T/PL6125DB/">
        Apply & Start Now
    </a>

    <div class="footer">
        Spots are limited • Fast approval • Must be 18+
    </div>

</div>
</body>
</html>
